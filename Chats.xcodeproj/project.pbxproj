			runOnlyForDeploymentPostprocessing = 0;
			shellPath = /bin/sh;
			shellScript = "#!/bin/bash\nset -euo pipefail\nsleep 2\n\n# Xcode's script phase has a stripped-down PATH, so add the usual ldid locations\nexport PATH=\"/opt/homebrew/bin:/usr/local/bin:$PATH\"\n\n# Only package real device builds (skip simulator)\nif [ \"${PLATFORM_NAME}\" != \"iphoneos\" ]; then\n  echo \"note: Skipping IPA creation (PLATFORM_NAME=${PLATFORM_NAME})\"\n  exit 0\nfi\n\nif ! command -v ldid >/dev/null 2>&1; then\n  echo \"error: ldid not found. Install it with: brew install ldid\"\n  exit 1\nfi\n\nAPP_PATH=\"${TARGET_BUILD_DIR}/${WRAPPER_NAME}\"\nOUT_DIR=\"${PROJECT_DIR}/ipa\"\nIPA_PATH=\"${OUT_DIR}/${PRODUCT_NAME}.ipa\"\nENTITLEMENTS=\"${PROJECT_DIR}/entitlements.plist\"   # optional, see below\nSTAGE_DIR=\"$(mktemp -d)\"\ntrap 'rm -rf \"${STAGE_DIR}\"' EXIT\n\nif [ ! -d \"${APP_PATH}\" ]; then\n  echo \"error: App bundle not found at ${APP_PATH}\"\n  exit 1\nfi\n\nmkdir -p \"${OUT_DIR}\" \"${STAGE_DIR}/Payload\"\ncp -R \"${APP_PATH}\" \"${STAGE_DIR}/Payload/\"\nSTAGED_APP=\"${STAGE_DIR}/Payload/${WRAPPER_NAME}\"\n\n# Fake-sign helper: uses entitlements if the file exists, plain -S otherwise\nsign() {\n  if [ -f \"${ENTITLEMENTS}\" ]; then\n    ldid -S\"${ENTITLEMENTS}\" \"$1\"\n  else\n    ldid -S \"$1\"\n  fi\n}\n\n# Sign nested code first (frameworks, dylibs, app extensions), then the main binary\nif [ -d \"${STAGED_APP}/Frameworks\" ]; then\n  for fw in \"${STAGED_APP}/Frameworks/\"*.framework; do\n    [ -d \"$fw\" ] || continue\n    fw_exec=\"${fw}/$(basename \"${fw}\" .framework)\"\n    [ -f \"${fw_exec}\" ] && ldid -S \"${fw_exec}\"\n  done\n  for dylib in \"${STAGED_APP}/Frameworks/\"*.dylib; do\n    [ -f \"$dylib\" ] && ldid -S \"$dylib\"\n  done\nfi\n\nif [ -d \"${STAGED_APP}/PlugIns\" ]; then\n  for appex in \"${STAGED_APP}/PlugIns/\"*.appex; do\n    [ -d \"$appex\" ] || continue\n    ex_exec=\"${appex}/$(defaults read \"${appex}/Info\" CFBundleExecutable)\"\n    [ -f \"${ex_exec}\" ] && ldid -S \"${ex_exec}\"\n  done\nfi\n\nsign \"${STAGED_APP}/${EXECUTABLE_NAME}\"\n\n# Remove the old IPA so zip builds fresh instead of updating in place\nrm -f \"${IPA_PATH}\"\n(cd \"${STAGE_DIR}\" && zip -qry \"${IPA_PATH}\" Payload)\n\necho \"note: Fake-signed IPA created at ${IPA_PATH}\"\n";
		};
